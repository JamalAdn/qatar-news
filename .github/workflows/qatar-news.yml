name: Qatar News edition

on:
  schedule:
    # GitHub cron runs in UTC. 03:45 UTC = 06:45 Doha, 15:45 UTC = 18:45 Doha.
    # GitHub can start scheduled runs a few minutes late, so we start early.
    - cron: "45 3 * * *"
    - cron: "45 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

concurrency:
  group: qatar-news-edition
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Write the new edition with Claude
        uses: anthropics/claude-code-action@v1
        with:
          # Set ONE of these two secrets in Settings > Secrets and variables > Actions.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "WebSearch,WebFetch,Read,Edit,Write,Bash(date:*),Bash(python3:*)"
          prompt: |
            You maintain the public site qatarnewstoday.date. Its stories live in editions.json in this repo:
            {"editions":[ {edition}, ... ]}, newest first. Your job: find every Qatar-related story published
            by the outlets below in the last 12 hours and add ONE new edition to the top of that array.
            Only edit editions.json. Do not touch any other file.

            SOURCE ROSTER (only these outlets count)
            US: New York Times, Wall Street Journal, Washington Post, Bloomberg, Politico, CNN, Axios, Fox News
            Israel: Haaretz, Times of Israel, Jerusalem Post, Ynet / Yedioth Ahronoth, Israel Hayom, Maariv, Globes, i24NEWS, N12 (Channel 12 / mako), Kan
            Wires: AP, Reuters, AFP
            UK: Financial Times, The Guardian, BBC, The Economist

            HOW TO SEARCH
            1. Get the current time with `date -u`.
            2. WebSearch per outlet group: "Qatar <outlet> <today's date>", "Doha <outlet>", plus topical queries for
               live Qatar stories (mediation, LNG / Ras Laffan, Al Udeid, Iran / Hormuz, QIA investments, Hamas / Gaza, sport).
            3. WebFetch these dated topic pages: https://www.jpost.com/tags/qatar ,
               https://www.timesofisrael.com/topic/qatar/ , https://www.ynet.co.il/topics/%D7%A7%D7%98%D7%90%D7%A8 .
               Try other outlets' Qatar tag pages too and skip any that are blocked.
            4. Also search in Hebrew ("קטאר") for Hebrew-only Israeli stories.
            5. A wire story republished by a roster outlet counts: outlet like "The Jerusalem Post (Reuters)", region "Wire".
            6. Include a story ONLY if you have its real URL and can confirm it was published in the last ~12 hours
               (allow up to 14h overlap). Never invent URLs, headlines, times or summaries. If you know the date but not
               the time, set "dateOnly": true. Drop any story whose URL already appears in the 3 newest editions.

            EDITION FORMAT (keys exactly as below)
            {
              "id": "YYYY-MM-DD-am" or "YYYY-MM-DD-pm" (Doha date; am for the morning run, pm for the evening run),
              "runAt": current time, ISO 8601 UTC,
              "label": e.g. "Sun 11 Oct · Morning" or "Sun 11 Oct · Evening",
              "brief": 2-3 plain sentences for public readers on what Qatar coverage was about in this window, noting any
                       difference in framing between US and Israeli outlets. No em dashes. No internal jargon.
              "stories": [ { "outlet", "region": "US"|"Israel"|"Wire"|"UK", "lang": "en"|"he",
                             "headline" (English; translate Hebrew), "original_headline" (Hebrew original, only if lang is "he"),
                             "url", "published" (ISO UTC), "dateOnly" (optional bool),
                             "summary" (one factual sentence in your own words, never copied article text, no em dashes),
                             "major" (true only for significant developments: security incidents, mediation breakthroughs,
                                      major deals, diplomatic ruptures) } ]
            }
            If nothing qualifies, still add the edition with "stories": [] and a brief saying no tracked outlet covered
            Qatar in this window. If an edition with the same id already exists, replace it instead of adding a duplicate.
            Keep at most 120 editions (drop the oldest). The file must stay valid JSON, UTF-8, Hebrew unescaped.

      - name: Check the file is valid
        run: python3 -c "import json; d=json.load(open('editions.json')); assert isinstance(d['editions'], list) and d['editions']; print(len(d['editions']), 'editions; newest:', d['editions'][0]['id'])"

      - name: Publish
        run: |
          git config user.name "Qatar News Desk"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editions.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Edition $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
